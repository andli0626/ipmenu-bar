<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>IP</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            /* 窗口为不透明窗口（Windows 上透明分层窗口内容不可见），这里铺满底色 */
            background: #16181f;
            overflow: hidden;
            user-select: none;
            font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        .pill {
            height: 100%;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 0 12px;
            background: #16181f;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
        }
        .dot {
            flex: 0 0 auto;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3ddc84;
            box-shadow: 0 0 6px rgba(61, 220, 132, 0.7);
        }
        .dot.off {
            background: #ff6b6b;
            box-shadow: none;
        }
        .ip {
            flex: 1;
            min-width: 0;
            font-family: Consolas, Monaco, monospace;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ip.empty {
            font-size: 13px;
            font-weight: 400;
            color: #8a8f99;
        }
        .act {
            flex: 0 0 auto;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            display: grid;
            place-items: center;
            color: #9aa0aa;
            font-size: 13px;
            line-height: 1;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .act:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
        }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 3px;
            transform: translateX(-50%) translateY(5px);
            font-size: 11px;
            color: #3ddc84;
            opacity: 0;
            transition: all 0.18s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
<div class="pill" data-tauri-drag-region>
    <span class="dot" id="dot" data-tauri-drag-region></span>
    <span class="ip empty" id="ip" data-tauri-drag-region>正在获取...</span>
    <div class="act" id="copy" title="复制当前 IP">&#10697;</div>
    <div class="act" id="hide" title="收起（点击托盘图标可重新显示）">&#215;</div>
</div>
<div class="toast" id="toast">已复制</div>

<script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;

    const ipEl = document.getElementById('ip');
    const dotEl = document.getElementById('dot');
    const toastEl = document.getElementById('toast');
    let currentIp = '';

    // 空白占位与错误态的文案区分：空字符串代表"当前无连接"
    function render(rawIp) {
        currentIp = rawIp || '';
        ipEl.title = currentIp; // IPv6 过长时会被省略号截断，悬浮看完整值
        if (currentIp) {
            ipEl.textContent = currentIp;
            ipEl.classList.remove('empty');
            dotEl.classList.remove('off');
        } else {
            ipEl.textContent = '无连接';
            ipEl.classList.add('empty');
            dotEl.classList.add('off');
        }
    }

    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 1200);
    }

    document.getElementById('copy').addEventListener('click', async () => {
        if (!currentIp) {
            showToast('暂无 IP');
            return;
        }
        try {
            await invoke('copy_to_clipboard', { text: currentIp });
            showToast('已复制');
        } catch (e) {
            showToast('复制失败');
        }
    });

    document.getElementById('hide').addEventListener('click', () => {
        // 收起后不销毁窗口，点托盘图标可立即唤出，避免重复创建 webview
        window.__TAURI__.window.getCurrentWindow().hide();
    });

    // 网络切换 / 刷新公网 IP / 选择其他网卡时，后端会推送最新值
    listen('ip:update', (event) => {
        render(event.payload && event.payload.ip);
    });

    // 首次加载主动拉取，避免后端 emit 早于监听注册导致空白
    invoke('get_current_ip').then(render).catch(() => render(''));
</script>
</body>
</html>
