name: Release

# 打 tag（如 v1.2.4）即触发多端打包；也可在 Actions 页面手动 Run workflow。
#
# 结构：build(matrix，各平台并行编译打包) -> release(汇总产物，统一发布)
# 这样任一平台失败都不会产生"只有一半资产"的 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  APP_NAME: IPMenuBar

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：一次编译出 arm64 + x64 通用二进制，产出单个 dmg
          - label: macOS (universal)
            platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            asset_tag: macos-universal
          # Windows：NSIS 安装包（setup.exe，免管理员）+ MSI
          - label: Windows (x64)
            platform: windows-latest
            args: --bundles nsis,msi
            rust_targets: ''
            asset_tag: windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # 版本号是双源（Cargo.toml + tauri.conf.json），必须在打包前强校验，
      # 否则会出现「关于」里显示旧版本、安装包文件名是新版本的情况。
      - name: Verify version consistency
        shell: bash
        run: |
          set -euo pipefail
          CONF_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VER=$(grep -m1 -E '^version[[:space:]]*=' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tauri.conf.json = ${CONF_VER} / Cargo.toml = ${CARGO_VER}"
          if [ "${CONF_VER}" != "${CARGO_VER}" ]; then
            echo "::error::版本号不一致：tauri.conf.json=${CONF_VER}，Cargo.toml=${CARGO_VER}"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            if [ "${TAG_VER}" != "${CONF_VER}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} 与 tauri.conf.json 版本 ${CONF_VER} 不一致"
              exit 1
            fi
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.asset_tag }}
          cache-on-failure: true

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@^2

      # 用 shell 步骤而不是 tauri-action：CLI 的原始报错能进日志，
      # 失败时还能被下面的步骤收进 job summary 直接查。
      - name: Build bundles
        shell: bash
        run: |
          set -o pipefail
          tauri build ${{ matrix.args }} 2>&1 | tee build.log

      - name: Dump build log on failure
        if: failure()
        shell: bash
        run: |
          {
            echo '### tauri build 失败（最后 60 行）'
            echo '```'
            tail -n 60 build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 产物统一改成 ASCII 名：productName 是中文「ip地址」，默认文件名在
      # Release 下载 URL 里会被 percent-encode，脚本/下载器容易出问题。
      - name: Stage assets with ASCII names
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          while IFS= read -r f; do
            case "$f" in
              *.dmg) cp "$f" "dist/${APP_NAME}_${VER}_${{ matrix.asset_tag }}.dmg" ;;
              *.msi) cp "$f" "dist/${APP_NAME}_${VER}_${{ matrix.asset_tag }}.msi" ;;
              *setup.exe) cp "$f" "dist/${APP_NAME}_${VER}_${{ matrix.asset_tag }}-setup.exe" ;;
              *) echo "skip $f" ;;
            esac
          done < <(find src-tauri/target -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*setup.exe' \))
          ls -lh dist

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_tag }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          TAG="v${VER}"
          echo "发布 ${TAG}"
          ls -lh dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release 已存在，改为覆盖上传"
            gh release edit "$TAG" --draft=false --title "${APP_NAME} ${TAG}" --notes-file .github/release-notes.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "${APP_NAME} ${TAG}" \
              --notes-file .github/release-notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
          echo "---- 最终资产 ----"
          gh release view "$TAG" --json assets --jq '.assets[].name'
